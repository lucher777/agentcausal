name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=agentcausal --cov-report=term-missing --cov-report=xml
      - name: Verify numerical identities
        run: python -m agentcausal.cli equiv --tol 1e-10
      - name: Run quickstart example
        run: python examples/quickstart.py

  minimum-deps:
    name: Oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pinned minimum versions
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.23.5" "scipy==1.10.1" "scikit-learn==1.2.2" "pytest>=7.4" "pytest-cov>=4.1"
          pip install -e . --no-deps
      - name: Run tests
        run: pytest tests/ -v

  torch-cpu:
    name: Optional PyTorch installed (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v
